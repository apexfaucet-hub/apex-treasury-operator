[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
# Test-only "dynamic linking" replaces `new X` with cheatcodes; test/arc/ArcHarness.sol must run on a real Arc node.
dynamic_test_linking = false
remappings = [
  "@openzeppelin/=lib/openzeppelin-contracts/",
  "forge-std/=lib/forge-std/src/",
]

[fuzz]
runs = 2000

[invariant]
runs = 64
depth = 64
